name: Update site from CV

# When a CV PDF is pushed (or this is run by hand), read it and rewrite the CV-driven parts of
# index.html: latest publications, publications, appointments, education, funding, teaching,
# supervision, service, volunteering, peer review and the CV download links. Then redraw the
# word cloud and commit everything in one step.
# To run it by hand: Actions tab > Update site from CV > Run workflow.
on:
  push:
    paths:
      - "*.pdf"
      - ".github/scripts/build_from_cv.py"
      - ".github/workflows/update-from-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the newest commit, even if another run just pushed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and the PDF text tool
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-crosextra-caladea poppler-utils

      - name: Install Python packages
        run: pip install numpy pillow matplotlib

      - name: Read the CV and rewrite index.html
        run: python .github/scripts/build_from_cv.py

      - name: Redraw the word cloud
        run: python .github/scripts/build_wordcloud.py

      - name: Commit the changes
        run: |
          git add index.html data/cv.json wordcloud.png data/wordcloud-terms.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update site from CV"
          git pull --rebase
          git push
